server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=mysecret
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=true
spring.data.mongodb.uri=mongodb://localhost:27017/kino

# === Kafka Konfiguration ===
spring.kafka.bootstrap-servers=localhost:9092

# Producer (JSON Serialisierung)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Sende Typ-Header mit, damit Consumer den Typ erkennen kann
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Consumer (JSON Deserialisierung mit ErrorHandling)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# Delegierter Value-Deserializer ist der JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Vertrauenswürdige Packages für JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=kino.application.kafka.events
# Type Mapping verwenden statt Default-Type (damit mehrere Command-Typen funktionieren)
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

# Kafka Topics
kino.kafka.topic.reservations=reservation-commands
kino.kafka.topic.reservation-events=reservation-events
kino.kafka.topic.bookings=booking-commands
kino.kafka.topic.booking-events=booking-events
kino.kafka.topic.admin=admin-commands
kino.kafka.topic.admin-events=admin-events
kino.kafka.topic.customer=customer-commands
kino.kafka.topic.customer-events=customer-events

